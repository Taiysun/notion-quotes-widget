
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    background:#000;
    font-family:Arial,sans-serif;

    /* faz ocupar tela toda */
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* agora não é “cartão”, é só conteúdo solto */
.container{
    color:white;
    padding:40px;
    max-width:700px;
    text-align:left;
}

.quote{
    font-size:22px;
    line-height:1.5;
    margin-bottom:15px;
}

.author{
    font-weight:bold;
    font-size:18px;
    opacity:0.8;
}

</style>
</head>

<body>

<div class="container">

<div class="quote" id="quote">
Carregando...
</div>

<div class="author" id="author">
</div>

</div>

<script>

fetch("quotes.json")
.then(r=>r.json())
.then(quotes=>{

    const startDate =
    new Date("2025-01-01");

    const today =
    new Date();

    const days =
    Math.floor(
    (today-startDate)/86400000
    );

    const quote =
    quotes[
    days % quotes.length
    ];

    document.getElementById("quote")
    .innerText = quote.text;

    document.getElementById("author")
    .innerText = "— " + quote.author;

});

</script>

</body>
</html>
