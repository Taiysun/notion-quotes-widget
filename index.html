
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Quotes Widget</title>

  <style>
body {
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  text-align: center;

  background-color: #202020;
  color: #ffffff;
}

    #quote {
      max-width: 500px;
      font-size: 18px;
      line-height: 1.4;
    }

    #author {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div>
    <div id="quote"></div>
    <div id="author"></div>
  </div>

  <script>
    async function loadQuote() {
      const res = await fetch('./quotes.json');
      const data = await res.json();

      const random = data[Math.floor(Math.random() * data.length)];

      document.getElementById('quote').innerText = `"${random.text}"`;
      document.getElementById('author').innerText = `— ${random.author}`;
    }

    loadQuote();
  </script>
</body>
</html>
