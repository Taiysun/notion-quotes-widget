<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frase do Dia</title>

<style>
body {
    margin: 0;
    background: #191919;
    color: white;
    font-family: Inter, sans-serif;
}

.widget {
    width: 100%;
    box-sizing: border-box;
    padding: 20px 30px;
    border-radius: 12px;
    background: #191919;
}

.quote {
    font-size: 1.5rem;
    line-height: 1.6;
    font-weight: 400;
}

.author {
    margin-top: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    opacity: 0.75;
}
</style>

</head>

<body>

<div class="widget">
    <div class="quote" id="quote"></div>
    <div class="author" id="author"></div>
</div>

<script>
const quotes = [
{
    text: "Você não precisa ser produtiva para merecer descanso.",
    author: "Lilian"
},
{
    text: "Pequenos passos também levam a grandes lugares.",
    author: "Lilian"
},
{
    text: "Consistência supera motivação.",
    author: "Lilian"
},
{
    text: "Seu corpo merece cuidado, não punição.",
    author: "Lilian"
}
];

// Número do dia desde 01/01/1970
const dayNumber = Math.floor(Date.now() / 86400000);

// Escolhe uma frase baseada no dia
const quote = quotes[dayNumber % quotes.length];

document.getElementById("quote").textContent = `"${quote.text}"`;
document.getElementById("author").textContent = `— ${quote.author}`;
</script>

</body>
</html>
