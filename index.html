<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>

body{
    margin:0;
    background:transparent;
    font-family:Arial,sans-serif;
}

.container{
    background:#1f1f1f;
    color:white;
    padding:25px 35px;
}

.quote{
    font-size:22px;
    line-height:1.5;
    margin-bottom:15px;
}

.author{
    font-weight:bold;
    font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<div class="quote" id="quote">
Carregando...
</div>

<div class="author" id="author">
</div>

</div>

<script>

fetch("quotes.json")
.then(r=>r.json())
.then(quotes=>{

    const startDate =
    new Date("2025-01-01");

    const today =
    new Date();

    const days =
    Math.floor(
    (today-startDate)/86400000
    );

    const quote =
    quotes[
    days % quotes.length
    ];

    document.getElementById("quote")
    .innerText = quote.text;

    document.getElementById("author")
    .innerText = "— " + quote.author;

});

</script>

</body>
</html>
